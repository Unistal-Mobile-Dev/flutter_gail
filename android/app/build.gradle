plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()

android {
    namespace = "unistal.app.hpoil"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    flavorDimensions "default"
    productFlavors {
        prodHPOIL {
            resValue "string", "app_name", "HPOIL Line Patrolling"
            applicationIdSuffix ".app.hpoil"
            manifestPlaceholders = [
                    appIcon: "@mipmap/hp_oil_logo",
                    appIconRound: "@mipmap/hp_oil_logo"
            ]
            def keystorePropertiesFile = rootProject.file('hpoil.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 2
            versionName "1.0.0-HPOIL"
        }
//        prodHPCL  {
//            resValue "string", "app_name", "HPCL Line Patrolling"
//            applicationIdSuffix ".hpcl.smartgasnet.app"
//            manifestPlaceholders = [
//                    appIcon: "@mipmap/unistal_logo",
//                    appIconRound: "@mipmap/unistal_logo"
//            ]
//            def keystorePropertiesFile = rootProject.file('hpcl.properties')
//            if (keystorePropertiesFile.exists()) {
//                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
//            }
//            versionCode 1
//            versionName "1.0.0-HPCL"
//        }
    }
    defaultConfig {
        applicationId = "unistal"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

//        ndk {
//            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
//        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}


dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.2.0")
    implementation "com.otaliastudios:transcoder:0.10.5"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
