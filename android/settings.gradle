// 🔹 MUST be first in file
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // ✅ Flutter SDK path setup (allowed inside pluginManagement)
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
}

// 🔹 Comes after pluginManagement
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.0" apply false
}

rootProject.name = "flutter_gail"
include(":app")

gradle.afterProject { proj ->
    if (proj.extensions.findByName('android') != null) {
        proj.android.ndkVersion = "27.0.12077973"
    }
}
