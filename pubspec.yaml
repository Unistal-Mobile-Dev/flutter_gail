name: flutter_gail
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  arcgis_maps:
    path: ../arcgis_maps_package

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  provider: ^6.0.5
  equatable: ^2.0.5
  http: ^1.1.0
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  multi_select_flutter: ^4.1.3
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.0.0
  dotted_border: ^2.1.0
  camera: ^0.11.0
  video_player: ^2.9.1
  flutter_local_notifications: ^17.2.2
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  dropdown_search: ^6.0.0
  file_picker: ^8.0.6
  mime: ^1.0.4
  textfield_search: ^0.11.1
  path_provider: ^2.1.2
  flutter_image_compress: ^2.1.0
  get_it: ^8.0.0
  firebase_auth: ^5.1.3
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  vibration: ^2.0.0
  audioplayers: ^6.0.0
  video_compress: ^3.1.2
  google_maps_flutter: ^2.6.1
  google_maps_polyline: ^1.0.3
  record: ^6.0.0
  pdf: ^3.11.1
  open_file: ^3.5.8
  battery_plus: ^6.2.0
  carousel_slider: ^5.0.0
  month_picker_dialog: ^5.1.3
  flutter_polyline_points: ^2.1.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.6

flutter:

  uses-material-design: true

  assets:
    - assets/

  fonts:
      - family: Poppins
        fonts:
          - asset: fonts/Poppins-Regular.ttf
            weight: 300
          - asset: fonts/Poppins-Medium.ttf
            weight: 500
          - asset: fonts/Poppins-SemiBold.ttf
            weight: 700

      - family: Rubik
        fonts:
          - asset: fonts/Rubik-Regular.ttf

      - family: Merriweather
        fonts:
          - asset: fonts/Merriweather-Regular.ttf
            weight: 300
          - asset: fonts/Merriweather-Bold.ttf
            weight: 500


flutter_icons:
    android: "ic_launcher_gail"
    ios: true
    remove_alpha_ios: true
    image_path: "assets/gail_logo.png"
    min_sdk_android: 21


module:
    androidX: true


