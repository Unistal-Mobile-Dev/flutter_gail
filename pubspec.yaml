  path_provider_android: 2.2.15
flutter:

  uses-material-design: true

  assets:
    - assets/

  fonts:
      - family: Poppins
        fonts:
          - asset: fonts/Poppins-Regular.ttf
            weight: 300
          - asset: fonts/Poppins-Medium.ttf
            weight: 500
          - asset: fonts/Poppins-SemiBold.ttf
            weight: 700

      - family: Rubik
        fonts:
          - asset: fonts/Rubik-Regular.ttf

      - family: Merriweather
        fonts:
          - asset: fonts/Merriweather-Regular.ttf
            weight: 300
          - asset: fonts/Merriweather-Bold.ttf
            weight: 500


flutter_icons:
    android: "ic_launcher_upims"
    ios: true
    remove_alpha_ios: true
    image_path: "assets/upims_logo.png"
    min_sdk_android: 21


module:
    androidX: true


