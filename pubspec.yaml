name: flutter_gail
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  provider: ^6.0.5
  equatable: ^2.0.5
  http: ^1.1.0
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  package_info_plus: ^8.0.2
  device_info_plus: ^11.5.0
  multi_select_flutter: ^4.1.3
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  dotted_border: ^3.1.0
  camera: ^0.11.0
  video_player: ^2.9.1
  flutter_local_notifications: ^19.4.1
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  dropdown_search: ^6.0.0
  file_picker: ^10.3.2
  mime: ^2.0.0
  textfield_search: ^0.11.1
  path_provider: ^2.1.2
  flutter_image_compress: ^2.1.0
  get_it: ^8.0.0
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  vibration: ^3.1.3
  audioplayers: ^6.0.0
  video_compress: ^3.1.2
  google_maps_flutter: ^2.14.0
  google_maps_polyline: ^1.0.3
  record: ^6.0.0
  pdf: ^3.11.1
  open_file: ^3.5.8
  battery_plus: ^6.2.0
  carousel_slider: ^5.0.0
  month_picker_dialog: ^6.5.0
  flutter_polyline_points: ^3.0.1
  crypto: ^3.0.6
  fl_chart: ^0.69.0
  flutter_otp_text_field: ^1.5.1+1
  flutter_tts: ^4.2.3
  flutter_typeahead: ^5.2.0
  connectivity_plus: ^7.0.0
  hive: ^2.2.3
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  wakelock_plus: ^1.3.3
  android_intent_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/logo/

  fonts:
      - family: Poppins
        fonts:
          - asset: fonts/Poppins-Regular.ttf
            weight: 300
          - asset: fonts/Poppins-Medium.ttf
            weight: 500
          - asset: fonts/Poppins-SemiBold.ttf
            weight: 700

      - family: Rubik
        fonts:
          - asset: fonts/Rubik-Regular.ttf

      - family: Merriweather
        fonts:
          - asset: fonts/Merriweather-Regular.ttf
            weight: 300
          - asset: fonts/Merriweather-Bold.ttf
            weight: 500


flutter_icons:
    android: "hp_oil_logo"
    ios: true
    remove_alpha_ios: true
    image_path: "assets/logo/hp_oil_logo.png"
    min_sdk_android: 21


module:
    androidX: true


